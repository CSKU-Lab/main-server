name: E2E Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  e2e-tests:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cs_pg_user
          POSTGRES_PASSWORD: cs_pg_password
          POSTGRES_DB: main-server-test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5433:5432

      mongodb:
        image: mongo:7-jammy
        env:
          MONGO_INITDB_ROOT_USERNAME: cs_mongo_user
          MONGO_INITDB_ROOT_PASSWORD: cs_mongo_password
        options: >-
          --health-cmd "echo 'db.runCommand(\"ping\").ok' | mongosh localhost:27017/test --quiet"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 27019:27017

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6380:6379

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.23'
        cache: true

    - name: Install Atlas CLI
      run: |
        curl -sSf https://atlasgo.sh | sh
        atlas version

    - name: Wait for PostgreSQL
      run: |
        until pg_isready -h localhost -p 5433 -U cs_pg_user; do
          echo "Waiting for PostgreSQL..."
          sleep 2
        done
        echo "PostgreSQL is ready"

    - name: Wait for MongoDB
      run: |
        until mongosh --host localhost --port 27019 --eval "db.adminCommand('ping')" > /dev/null 2>&1; do
          echo "Waiting for MongoDB..."
          sleep 2
        done
        echo "MongoDB is ready"

    - name: Wait for Redis
      run: |
        until redis-cli -h localhost -p 6380 ping > /dev/null 2>&1; do
          echo "Waiting for Redis..."
          sleep 2
        done
        echo "Redis is ready"

    - name: Run database migrations
      env:
        PGHOST: localhost
        PGPORT: 5433
        PGUSER: cs_pg_user
        PGPASSWORD: cs_pg_password
        PGDATABASE: main-server-test
      run: |
        echo "Running database migrations..."
        atlas schema apply \
          --url "postgres://cs_pg_user:cs_pg_password@localhost:5433/main-server-test?sslmode=disable" \
          --to "file://atlas/schema.hcl" \
          --dev-url "postgres://cs_pg_user:cs_pg_password@localhost:5433/main-server-test?sslmode=disable" \
          --auto-approve

    - name: Run E2E tests
      env:
        PGHOST: localhost
        PGPORT: 5433
        PGUSER: cs_pg_user
        PGPASSWORD: cs_pg_password
        PGDATABASE: main-server-test
        MONGO_HOST: localhost
        MONGO_PORT: 27019
        MONGO_USER: cs_mongo_user
        MONGO_PASSWORD: cs_mongo_password
        REDIS_HOST: localhost
        REDIS_PORT: 6380
        JWT_SECRET: test-jwt-secret-for-ci
        JWT_REFRESH_SECRET: test-refresh-secret-for-ci
        RUN_E2E_TESTS: "true"
        CI: "true"
      run: |
        echo "Running E2E tests..."
        go test -tags=e2e ./tests/e2e/... -v -timeout 10m 2>&1 | tee e2e-test-results-ci.txt
        exit ${PIPESTATUS[0]}

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: e2e-test-results
        path: e2e-test-results-ci.txt
        retention-days: 30

    - name: Parse test results
      if: always()
      run: |
        echo "=== E2E Test Summary ==="
        if [ -f e2e-test-results-ci.txt ]; then
          # Count passing test suites
          PASSING=$(grep -c "^--- PASS:" e2e-test-results-ci.txt || echo "0")
          FAILING=$(grep -c "^--- FAIL:" e2e-test-results-ci.txt || echo "0")
          
          echo "Passing test suites: $PASSING"
          echo "Failing test suites: $FAILING"
          
          # Show failing tests
          if [ "$FAILING" -gt 0 ]; then
            echo ""
            echo "=== Failing Test Suites ==="
            grep "^--- FAIL:" e2e-test-results-ci.txt || true
          fi
          
          # Show overall result
          if grep -q "^PASS$" e2e-test-results-ci.txt; then
            echo ""
            echo "✅ All tests passed!"
          else
            echo ""
            echo "⚠️  Some tests failed"
            exit 1
          fi
        else
          echo "❌ Test results file not found"
          exit 1
        fi

    - name: Comment PR with test results
      if: github.event_name == 'pull_request' && always()
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const path = 'e2e-test-results-ci.txt';
          
          let summary = '### E2E Test Results\n\n';
          
          if (fs.existsSync(path)) {
            const content = fs.readFileSync(path, 'utf8');
            
            // Count results
            const passing = (content.match(/^--- PASS:/gm) || []).length;
            const failing = (content.match(/^--- FAIL:/gm) || []).length;
            const overallPass = content.includes('\nPASS\n');
            
            summary += `**Test Suites:** ${passing} passing, ${failing} failing\n\n`;
            summary += overallPass ? '✅ **All tests passed!**\n' : '⚠️ **Some tests failed**\n';
            
            // List failing suites
            if (failing > 0) {
              summary += '\n**Failing Suites:**\n';
              const failingSuites = content.match(/^--- FAIL:.*/gm) || [];
              failingSuites.forEach(suite => {
                summary += `- ${suite.replace('--- FAIL: ', '')}\n`;
              });
            }
          } else {
            summary += '❌ **Test results not found**\n';
          }
          
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: summary
          });
